<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#086b78">
  <meta name="description" content="2026 年 9 月沖繩六人家庭自駕互動行程：北部兩晚、那霸兩晚，兼顧長輩、幼童與颱風備案。">
  <meta property="og:title" content="沖繩家庭自駕｜2026.09.01–09.05">
  <meta property="og:description" content="五天四夜互動路線、每日節奏與颱風備案。">
  <meta property="og:type" content="website">
  <title>沖繩家庭自駕｜2026.09.01–09.05</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --ocean: #086b78;
      --ocean-deep: #074956;
      --lagoon: #14a99a;
      --sky: #55bfe8;
      --coral: #f26f5b;
      --sun: #ffc857;
      --sand: #fff8e8;
      --foam: #f8fdfb;
      --ink: #12383f;
      --muted: #607a7f;
      --line: rgba(18, 56, 63, .14);
      --shadow: 0 18px 46px rgba(5, 73, 86, .16);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html {
      max-width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }
    body {
      max-width: 100%;
      color: var(--ink);
      background: var(--foam);
      font-family: "Noto Sans TC", system-ui, sans-serif;
      overflow-x: hidden;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; font: inherit; }
    button:focus-visible, a:focus-visible, .stop-photo:focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 3px;
    }

    .topbar {
      position: relative;
      z-index: 800;
      display: flex;
      min-height: 66px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 12px clamp(18px, 3vw, 42px);
      color: #fff;
      background: var(--ocean-deep);
    }
    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      position: relative;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      overflow: hidden;
      background: var(--sun);
      border-radius: 50%;
    }
    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      right: -7px;
      left: -7px;
      height: 12px;
      content: "";
      background: var(--lagoon);
      border-radius: 50%;
    }
    .brand-mark::before { bottom: 7px; transform: rotate(-7deg); }
    .brand-mark::after { bottom: -1px; background: var(--sky); transform: rotate(6deg); }
    .brand-name {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
    }
    .brand-name small {
      display: block;
      margin-top: 3px;
      color: #b9d9d9;
      font-family: "Noto Sans TC", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .trip-meta {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #d8ecea;
      font-size: 13px;
      font-weight: 650;
    }
    .trip-meta span + span {
      padding-left: 18px;
      border-left: 1px solid rgba(255, 255, 255, .2);
    }

    .trip-main {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(340px, 42%) minmax(0, 58%);
      grid-template-rows: minmax(490px, calc(100dvh - 196px)) 130px;
      min-height: calc(100dvh - 66px);
      background: var(--sand);
    }

    .overview-hero {
      position: relative;
      z-index: 3;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: space-between;
      overflow: clip;
      padding: clamp(34px, 5vw, 72px);
      color: #fff;
      background: var(--ocean);
    }
    .overview-hero::before {
      position: absolute;
      top: -15%;
      right: -12%;
      width: 57%;
      aspect-ratio: 1;
      content: "";
      background: var(--lagoon);
      border-radius: 45% 55% 58% 42%;
      opacity: .72;
      transform: rotate(20deg);
    }
    .overview-hero::after {
      position: absolute;
      right: -8%;
      bottom: -30%;
      width: 82%;
      aspect-ratio: 1.6;
      content: "";
      background: var(--sky);
      border-radius: 50% 46% 0 0;
      opacity: .34;
      transform: rotate(-8deg);
    }
    .hero-copy, .hero-footer { position: relative; z-index: 1; }
    .hero-copy h1 {
      max-width: 9ch;
      margin: 0;
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: clamp(48px, 6vw, 88px);
      font-weight: 900;
      line-height: .98;
      letter-spacing: -.055em;
      text-wrap: balance;
    }
    .hero-copy p {
      max-width: 33ch;
      margin: 24px 0 0;
      color: #d9eeeb;
      font-size: clamp(16px, 1.35vw, 18px);
      line-height: 1.75;
    }
    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }
    .hero-stats span {
      padding: 7px 10px;
      color: #fff;
      background: rgba(255, 255, 255, .11);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }
    .hero-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding-top: 36px;
    }
    .hero-note {
      max-width: 28ch;
      color: #c8e4e1;
      font-size: 14px;
      line-height: 1.6;
    }
    .hero-note strong { display: block; margin-bottom: 3px; color: var(--sun); font-size: 14px; }
    .trip-launch {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-self: flex-end;
      padding-top: 31px;
    }
    .turtle-friend {
      position: absolute;
      z-index: 2;
      top: -3px;
      right: 7px;
      width: 67px;
      height: auto;
      filter: drop-shadow(0 7px 6px rgba(5, 73, 86, .22));
      pointer-events: none;
      transform: rotate(-4deg);
    }
    .turtle-friend .hello-fin {
      transform-box: fill-box;
      transform-origin: 90% 70%;
      animation: turtleHello 1.05s var(--ease) .55s both;
    }
    .primary-action {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 17px;
      cursor: pointer;
      color: var(--ocean-deep);
      background: var(--sun);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 8px 0 rgba(5, 73, 86, .24);
      font-size: 14px;
      font-weight: 850;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease);
    }
    .primary-action:hover { transform: translateY(-2px); box-shadow: 0 10px 0 rgba(5, 73, 86, .24); }
    .primary-action:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(5, 73, 86, .24); }

    .map-stage {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #bfe4e2;
    }
    #map { width: 100%; height: 100%; background: #bfe4e2; }
    #map .leaflet-tile-pane { filter: grayscale(.12) saturate(.58) contrast(1.18) brightness(.96); }
    #map .leaflet-overlay-pane path {
      filter:
        drop-shadow(0 0 1px rgba(255, 255, 255, .98))
        drop-shadow(0 0 3px rgba(255, 255, 255, .92));
    }
    .map-heading {
      position: absolute;
      z-index: 500;
      top: 22px;
      left: 22px;
      max-width: calc(100% - 144px);
      padding: 11px 14px;
      color: var(--ocean-deep);
      background: rgba(255, 255, 255, .94);
      border-radius: 16px;
      box-shadow: var(--shadow);
      pointer-events: none;
    }
    .map-heading strong, .map-heading span { display: block; }
    .map-heading strong { font-family: "Zen Maru Gothic", sans-serif; font-size: 17px; }
    .map-heading span { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .map-controls {
      position: absolute;
      z-index: 500;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 7px;
    }
    .map-control {
      min-height: 42px;
      padding: 9px 12px;
      cursor: pointer;
      color: #fff;
      background: var(--ocean-deep);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 7px 20px rgba(7, 73, 86, .2);
      font-size: 13px;
      font-weight: 800;
    }
    .map-control:hover { background: var(--ocean); }

    .day-board {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-column: 1 / -1;
      min-width: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      box-shadow: 0 -10px 30px rgba(5, 73, 86, .08);
    }
    .day-button {
      position: relative;
      min-width: 0;
      padding: 18px clamp(12px, 2vw, 25px) 15px;
      cursor: pointer;
      color: var(--ink);
      background: #fff;
      border: 0;
      border-right: 1px solid var(--line);
      text-align: left;
      transition: background .2s ease, color .2s ease;
    }
    .day-button:last-child { border-right: 0; }
    .day-button::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 5px;
      content: "";
      background: var(--day-color);
    }
    .day-button:hover { background: color-mix(in srgb, var(--day-color) 9%, white); }
    .day-button.active { color: #fff; background: var(--day-color); }
    .day-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 850;
    }
    .day-number {
      display: inline-grid;
      width: 27px;
      height: 27px;
      place-items: center;
      color: var(--day-color);
      background: color-mix(in srgb, var(--day-color) 12%, white);
      border-radius: 50%;
      font-size: 12px;
    }
    .day-button.active .day-number { color: var(--day-color); background: #fff; }
    .day-button strong {
      display: block;
      overflow: hidden;
      margin-top: 10px;
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .day-button small {
      display: block;
      overflow: hidden;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .day-button.active small { color: rgba(255, 255, 255, .84); }

    .detail-panel {
      display: none;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: clamp(26px, 4vw, 48px);
      background: var(--foam);
      scrollbar-color: rgba(8, 107, 120, .35) transparent;
    }
    .detail-header { position: relative; }
    .back-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      gap: 7px;
      margin-bottom: 28px;
      padding: 7px 0;
      cursor: pointer;
      color: var(--ocean);
      background: none;
      border: 0;
      font-size: 14px;
      font-weight: 850;
    }
    .back-button:hover { color: var(--coral); }
    .detail-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .detail-day {
      color: var(--day-color);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .06em;
    }
    .weather-tag {
      padding: 6px 9px;
      color: var(--ocean-deep);
      background: var(--sun);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 850;
    }
    .detail-header h2 {
      max-width: 14ch;
      margin: 9px 0 0;
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: clamp(31px, 4vw, 48px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    .detail-summary {
      max-width: 48ch;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 21px; }
    .secondary-action {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      cursor: pointer;
      color: var(--ocean);
      background: transparent;
      border: 1px solid rgba(8, 107, 120, .26);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
    }
    .secondary-action:hover { background: rgba(20, 169, 154, .08); }

    .schedule-list {
      position: relative;
      margin: 36px 0 0;
      padding: 0;
      list-style: none;
    }
    .schedule-list::before {
      position: absolute;
      top: 21px;
      bottom: 21px;
      left: 71px;
      width: 2px;
      content: "";
      background: color-mix(in srgb, var(--day-color) 35%, white);
    }
    .schedule-stop {
      position: relative;
      display: grid;
      grid-template-columns: 51px 20px minmax(0, 1fr) 105px;
      gap: 10px;
      align-items: start;
      padding: 0 0 24px;
    }
    .stop-time {
      padding-top: 4px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .stop-dot {
      position: relative;
      z-index: 1;
      width: 14px;
      height: 14px;
      margin: 5px auto 0;
      background: #fff;
      border: 4px solid var(--day-color);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--foam);
    }
    .stop-copy { min-width: 0; }
    .stop-title {
      margin: 0;
      font-size: 17px;
      font-weight: 850;
      line-height: 1.4;
    }
    .stop-type {
      display: inline-block;
      margin-left: 7px;
      color: var(--day-color);
      font-size: 12px;
      font-weight: 850;
      vertical-align: 2px;
    }
    .stop-note {
      max-width: 50ch;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .stop-nav {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
      padding: 6px 10px;
      color: var(--ocean);
      background: #fff;
      border: 1px solid rgba(8, 107, 120, .2);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
    }
    .stop-nav:hover { color: #fff; background: var(--ocean); }
    .stop-photo {
      width: 105px;
      height: 78px;
      object-fit: cover;
      background: #d9eeee;
      border-radius: 16px;
      box-shadow: 0 7px 18px rgba(5, 73, 86, .12);
    }
    .fallback {
      margin: 4px 0 20px 81px;
      padding: 16px 18px;
      color: #fff;
      background: var(--ocean-deep);
      border-radius: 18px;
    }
    .fallback strong { display: block; margin-bottom: 5px; color: var(--sun); font-size: 14px; }
    .fallback p { margin: 0; color: #d5e8e6; font-size: 14px; line-height: 1.65; }

    .trip-main.is-detail {
      grid-template-columns: minmax(330px, 43%) minmax(0, 57%);
      grid-template-rows: 116px minmax(540px, calc(100dvh - 182px));
    }
    .trip-main.is-detail .overview-hero { display: none; }
    .trip-main.is-detail .map-stage { grid-column: 1; grid-row: 1 / -1; }
    .trip-main.is-detail .day-board {
      grid-column: 2;
      grid-row: 1;
      box-shadow: 0 8px 22px rgba(5, 73, 86, .07);
    }
    .trip-main.is-detail .day-button {
      min-height: 116px;
      padding: 14px 12px 10px;
    }
    .trip-main.is-detail .day-button strong { font-size: 13px; }
    .trip-main.is-detail .day-button small { display: none; }
    .trip-main.is-detail .detail-panel {
      display: block;
      grid-column: 2;
      grid-row: 2;
      animation: dayReveal .55s var(--ease) both;
    }

    .route-pin {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: #fff;
      background: var(--pin-color);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 5px 14px rgba(5, 73, 86, .3);
      font-size: 12px;
      font-weight: 900;
    }
    .leaflet-popup-content-wrapper {
      overflow: hidden;
      padding: 0;
      color: var(--ink);
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .leaflet-popup-content { width: 245px !important; margin: 0; }
    .leaflet-popup-tip { background: #fff; }
    .popup { padding: 15px; }
    .popup-photo {
      display: block;
      width: calc(100% + 30px);
      height: 132px;
      margin: -15px -15px 13px;
      object-fit: cover;
    }
    .popup-time {
      display: block;
      margin-bottom: 5px;
      color: var(--popup-color);
      font-size: 12px;
      font-weight: 900;
    }
    .popup h3 { margin: 0; font-size: 17px; line-height: 1.35; }
    .popup p { margin: 7px 0 12px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .popup-links { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .popup a { color: var(--ocean); font-size: 13px; font-weight: 850; text-decoration: none; }
    .popup .credit { color: var(--muted); font-size: 11px; font-weight: 600; text-align: right; }
    .leaflet-control-zoom { border: 0 !important; box-shadow: 0 6px 18px rgba(5, 73, 86, .16) !important; }
    .leaflet-control-zoom a { color: var(--ocean-deep) !important; background: #fff !important; }
    .leaflet-control-attribution { color: var(--muted); background: rgba(255, 255, 255, .9) !important; font-size: 10px; }

    @keyframes dayReveal {
      from { opacity: .2; clip-path: inset(0 0 12% 0); transform: translateY(14px); }
      to { opacity: 1; clip-path: inset(0); transform: translateY(0); }
    }
    @keyframes turtleHello {
      0%, 100% { transform: rotate(0); }
      42% { transform: rotate(-23deg); }
      70% { transform: rotate(8deg); }
    }

    @media (max-width: 900px) {
      .topbar { min-height: 60px; padding: 10px 16px; }
      .brand-name { font-size: 17px; }
      .trip-meta span:first-child { display: none; }
      .trip-meta span + span { padding-left: 0; border-left: 0; }

      .trip-main,
      .trip-main.is-detail {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(360px, 47dvh) auto auto;
        min-height: calc(100dvh - 60px);
      }
      .overview-hero {
        grid-column: 1;
        grid-row: 1;
        min-height: 385px;
        padding: 34px 20px 30px;
      }
      .hero-copy h1 { max-width: 9ch; font-size: clamp(48px, 10vw, 66px); }
      .hero-copy p { margin-top: 17px; font-size: 16px; }
      .hero-stats { margin-top: 20px; }
      .hero-footer { padding-top: 28px; }
      .map-stage,
      .trip-main.is-detail .map-stage {
        grid-column: 1;
        grid-row: 2;
        min-height: 360px;
      }
      .map-heading { top: 13px; left: 13px; }
      .map-controls { right: 12px; bottom: 12px; }
      .day-board,
      .trip-main.is-detail .day-board {
        position: sticky;
        top: 0;
        z-index: 850;
        display: grid;
        grid-template-columns: repeat(5, minmax(170px, 1fr));
        grid-column: 1;
        grid-row: 3;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        box-shadow: 0 8px 24px rgba(5, 73, 86, .12);
        scrollbar-width: thin;
      }
      .day-button,
      .trip-main.is-detail .day-button {
        min-height: 116px;
        padding: 15px 14px 12px;
      }
      .trip-main.is-detail .day-button strong { font-size: 16px; }
      .trip-main.is-detail .day-button small { display: block; }
      .trip-main.is-detail .overview-hero { display: none; }
      .trip-main.is-detail .detail-panel {
        grid-column: 1;
        grid-row: 4;
        overflow: visible;
      }
      .detail-panel {
        padding: 28px 18px calc(42px + env(safe-area-inset-bottom));
      }
      .back-button { margin-bottom: 22px; }
      .schedule-stop { grid-template-columns: 54px 20px minmax(0, 1fr) 88px; gap: 10px; }
      .schedule-list::before { left: 74px; }
      .stop-photo { width: 88px; height: 68px; border-radius: 13px; }
      .fallback { margin-left: 0; }
    }

    @media (max-width: 470px) {
      .trip-meta { font-size: 11px; }
      .overview-hero { min-height: 402px; }
      .hero-copy h1 {

            <a href="${photo.page}" target="_blank" rel="noopener"><img class="popup-photo" src="${photo.src}" alt="${photo.alt}"></a>
            <span class="popup-time">${day.date}（${day.weekday}） · ${stop.time} · ${stop.type}</span>
            <h3>${stop.name}</h3>
            <p>${stop.note}</p>
            <div class="popup-links">
              <a href="${mapsUrl(stop)}" target="_blank" rel="noopener">Google 地圖 →</a>
              <a class="credit" href="${photo.page}" target="_blank" rel="noopener">${photo.credit}</a>
            </div>
          </article>
        `);
        marker.on("click", () => {
          if (activeDay !== dayNumber) openDay(dayNumber, false);
        });
        markersByStop.set(stop, marker);
        return marker;
      });
      routes[dayNumber] = { line, markers };
    });

    function mapsUrl(stop) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.query)}`;
    }

    function renderDayBoard() {
      const board = document.getElementById("dayBoard");
      board.innerHTML = "";
      Object.entries(days).forEach(([number, day]) => {
        const dayNumber = Number(number);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day-button";
        button.dataset.day = number;
        button.style.setProperty("--day-color", day.color);
        button.setAttribute("aria-label", `${day.date} 星期${day.weekday}：${day.title}`);
        button.innerHTML = `
          <span class="day-topline"><span class="day-number">D${number}</span><span>${day.date} ${day.weekday}</span></span>
          <strong>${day.title}</strong>
          <small>${day.short}</small>
        `;
        button.addEventListener("click", () => openDay(dayNumber));
        board.appendChild(button);
      });
    }

    function syncRoutes() {
      Object.entries(routes).forEach(([number, route]) => {
        const selected = activeDay === Number(number);
        route.line.setStyle({
          weight: selected ? 8 : 5,
          opacity: activeDay === null ? .92 : selected ? 1 : .28,
          dashArray: selected ? null : "2 9"
        });
        if (selected && route.line.getElement()) route.line.bringToFront();
        route.markers.forEach(marker => {
          marker.setOpacity(activeDay === null || selected ? 1 : .14);
          const element = marker.getElement();
          if (element) element.style.pointerEvents = activeDay === null || selected ? "auto" : "none";
        });
      });
      document.querySelectorAll(".day-button").forEach(button => {
        const selected = Number(button.dataset.day) === activeDay;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-current", selected ? "date" : "false");
      });
    }

    function renderSchedule(dayNumber) {
      const day = days[dayNumber];
      const dayStops = stops.filter(stop => stop.day === dayNumber);
      document.getElementById("detailDay").textContent = `DAY ${dayNumber} · ${day.date} 星期${day.weekday}`;
      document.getElementById("detailTitle").textContent = day.title;
      document.getElementById("detailSummary").textContent = day.summary;
      document.getElementById("weatherTag").textContent = day.tag;
      document.getElementById("fallback").innerHTML = day.fallback;
      document.getElementById("firstNav").href = mapsUrl(dayStops[0]);

      const list = document.getElementById("scheduleList");
      list.style.setProperty("--day-color", day.color);
      list.innerHTML = "";
      dayStops.forEach(stop => {
        const photo = photos[stop.photo];
        const item = document.createElement("li");
        item.className = "schedule-stop";
        item.innerHTML = `
          <time class="stop-time">${stop.time}</time>
          <span class="stop-dot" aria-hidden="true"></span>
          <div class="stop-copy">
            <h3 class="stop-title">${stop.name}<span class="stop-type">${stop.type}</span></h3>
            <p class="stop-note">${stop.note}</p>
            <a class="stop-nav" href="${mapsUrl(stop)}" target="_blank" rel="noopener">導航到這裡 <span aria-hidden="true">↗</span></a>
          </div>
          <img class="stop-photo" src="${photo.src}" alt="${photo.alt}" title="在地圖查看此站" role="button" tabindex="0" loading="lazy">
        `;
        item.addEventListener("mouseenter", () => map.panTo([stop.lat, stop.lng]));
        const focusStop = () => {
          map.setView([stop.lat, stop.lng], 14, { animate: true });
          markersByStop.get(stop).openPopup();
        };
        const stopPhoto = item.querySelector(".stop-photo");
        stopPhoto.addEventListener("click", focusStop);
        stopPhoto.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            focusStop();
          }
        });
        list.appendChild(item);
      });
    }

    function fitDay(dayNumber) {
      const points = stops.filter(stop => stop.day === dayNumber).map(stop => [stop.lat, stop.lng]);
      map.fitBounds(L.latLngBounds(points), { padding: [42, 42], maxZoom: 12 });
    }

    function openDay(dayNumber, shouldScroll = true) {
      activeDay = dayNumber;
      const day = days[dayNumber];
      tripMain.classList.add("is-detail");
      tripMain.style.setProperty("--day-color", day.color);
      renderSchedule(dayNumber);
      syncRoutes();
      document.getElementById("mapTitle").textContent = `${day.date} · ${day.title}`;
      document.getElementById("mapSubtitle").textContent = day.summary;
      requestAnimationFrame(() => {
        map.invalidateSize();
        fitDay(dayNumber);
        if (shouldScroll && window.innerWidth <= 900) {
          document.getElementById("dayBoard").scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
      history.replaceState(null, "", `#day-${dayNumber}`);
    }

    function showOverview() {
      activeDay = null;
      tripMain.classList.remove("is-detail");
      syncRoutes();
      document.getElementById("mapTitle").textContent = "五日全島路線";
      document.getElementById("mapSubtitle").textContent = "那霸 → 本部／古宇利 → 那霸";
      requestAnimationFrame(() => {
        map.invalidateSize();
        map.fitBounds(allBounds, { padding: [44, 44], maxZoom: 10 });
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      history.replaceState(null, "", location.pathname);
    }

    renderDayBoard();
    syncRoutes();
    document.getElementById("startTrip").addEventListener("click", () => openDay(1));
    document.getElementById("backOverview").addEventListener("click", showOverview);
    document.getElementById("showDayMap").addEventListener("click", () => {
      fitDay(activeDay);
      if (window.innerWidth <= 900) document.getElementById("map").scrollIntoView({ behavior: "smooth" });
    });
    document.getElementById("fitDay").addEventListener("click", () => activeDay ? fitDay(activeDay) : openDay(1, false));
    document.getElementById("fitAll").addEventListener("click", () => {
      activeDay = null;
      syncRoutes();
      map.fitBounds(allBounds, { padding: [44, 44], maxZoom: 10 });
    });

    window.addEventListener("load", () => setTimeout(() => {
      map.invalidateSize();
      const match = location.hash.match(/^#day-([1-5])$/);
      if (match) openDay(Number(match[1]), false);
      else map.fitBounds(allBounds, { padding: [44, 44], maxZoom: 10 });
    }, 90));
  </script>
</body>
</html>
